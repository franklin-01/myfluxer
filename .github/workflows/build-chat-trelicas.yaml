# Builds the Chat trelicas desktop app (the self-hosted identity in
# fluxer_desktop/SELF_HOSTED_BUILD.md) for Windows x64 and Linux x64.
#
# It reuses the tools/ci steps of build-desktop.yaml but needs no secrets:
# nothing is signed, notarized or uploaded to a release feed. The packages are
# attached to the run as artifacts and, when publish_release is set, to a
# GitHub release in this repository. macOS is built locally, see the guide.
name: Build Chat trelicas desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version as YEAR.MDD.N, such as 2026.1025.0. Leave empty for today's date and the run number.
        required: false
        default: ""
      publish_release:
        description: Publish a GitHub release (tag chat-trelicas-v<version>) with the packages.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(date -u +%Y).$(date -u +%-m%d).${GITHUB_RUN_NUMBER}}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2026.1025.0, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    name: Build ${{ matrix.platform }} (x64)
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          # The packaging rejects binaries that need glibc above 2.35.
          - platform: linux
            os: ubuntu-22.04
    env:
      ARCH: x64
      ELECTRON_ARCH: x64
      BUILD_CHANNEL: stable
      RELEASE_CHANNEL: stable
      PUBLIC_RELEASE_CHANNEL: stable
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD_VERSION: ${{ needs.meta.outputs.version }}
      PUBLIC_BUILD_VERSION: ${{ needs.meta.outputs.version }}
      # The CI helper runs from its own checkout, like build-desktop.yaml: the
      # desktop build calls tools/ci again inside source/, and Windows cannot
      # replace a fluxer-ci.exe that is still running.
      CI_TOOL: ${{ github.workspace }}/_ci/tools/ci/Cargo.toml
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Ensure python3 command (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step ensure_python3_windows

      - name: Shorten Windows paths and pin pnpm store
        if: runner.os == 'Windows'
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step windows_paths

      - name: Set workdir (Linux)
        if: runner.os != 'Windows'
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step setup_pnpm

      - name: Resolve pnpm store path (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step resolve_pnpm_store_windows

      - name: Resolve pnpm store path (Linux)
        if: runner.os != 'Windows'
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step resolve_pnpm_store_unix

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-x64-pnpm-store-${{ hashFiles('source/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-x64-pnpm-store-

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step install_linux_deps

      - name: Set up Rust toolchain (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-gnu

      - name: Set up MSVC env (Windows)
        if: matrix.platform == 'windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64

      - name: Set up Rust toolchain (Windows)
        if: matrix.platform == 'windows'
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step set_build_channel

      - name: Build Electron main process
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step build_electron_main

      - name: Build Electron app (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step build_app_windows

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          USE_SYSTEM_FPM: true
        run: cargo run --locked --quiet --manifest-path ${{ env.CI_TOOL }} -- build-desktop --step build_app_linux

      # The Windows target is an unpacked folder; whoever uses it extracts the
      # ZIP and opens "Chat trelicas.exe".
      - name: Collect packages
        shell: bash
        working-directory: source/fluxer_desktop/dist-electron
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "${{ matrix.platform }}" = windows ]; then
            (cd win-unpacked && 7z a -tzip -mx=5 "$GITHUB_WORKSPACE/out/Chat-trelicas-$VERSION-win-x64.zip" . > /dev/null)
          else
            cp -v ./*.AppImage ./*.deb ./*.rpm ./*.tar.gz "$GITHUB_WORKSPACE/out/"
          fi
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > "SHA256SUMS-${{ matrix.platform }}.txt"
          ls -l

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-trelicas-${{ needs.meta.outputs.version }}-${{ matrix.platform }}-x64
          path: out
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub release
    needs:
      - meta
      - build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: packages
          pattern: chat-trelicas-${{ needs.meta.outputs.version }}-*
          merge-multiple: true

      # Re-running for a version that already has a release replaces its
      # files instead of failing.
      - name: Publish release
        run: |
          tag="chat-trelicas-v$VERSION"
          cat > notes.md <<NOTES
          App desktop do Chat trelicas, que abre https://chat.trelicas.net.br. Feito a partir do Fluxer (código neste repositório, licença AGPL-3.0).

          | Sistema | Arquivo |
          |---|---|
          | Windows x64 | \`Chat-trelicas-$VERSION-win-x64.zip\`: extraia e abra \`Chat trelicas.exe\` |
          | Linux x64 | \`.AppImage\` (\`chmod +x\` e abra), \`.deb\` (Ubuntu/Debian), \`.rpm\` (Fedora) ou \`.tar.gz\` |
          | macOS (Apple Silicon) | \`.dmg\`: arraste o app para Aplicativos |

          Os apps não têm assinatura de desenvolvedor, então o sistema avisa na primeira abertura:
          - **Windows:** em "O Windows protegeu o computador", clique em "Mais informações" e depois em "Executar assim mesmo".
          - **macOS:** abra uma vez, vá em Ajustes do Sistema → Privacidade e Segurança e clique em "Abrir Mesmo Assim".

          O app não se atualiza sozinho. Baixe as versões novas aqui. As somas SHA-256 estão nos arquivos \`SHA256SUMS-*.txt\`.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Chat trelicas $VERSION" --notes-file notes.md
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
